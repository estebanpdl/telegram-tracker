[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-tracker"
version = "0.1.0"
description = "Collect Telegram channel data and build a messages dataset and a channel network from it."
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[project.scripts]
tgtracker = "telegram_tracker.cli:command_main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["telegram_tracker*"]

[tool.setuptools.package-data]
"telegram_tracker.storage.sqlite" = ["schema-v1.sql"]
